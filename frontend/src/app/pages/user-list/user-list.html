<header class="user-list-header">
  <h1>Users</h1>
</header>

<mat-list>
  @for (user of users$ | async; track user.id) {
    <mat-list-item class="user-item" [routerLink]="['/home/profile', user.userName]">
      <img
        matListItemAvatar
        class="user-avatar"
        [src]="user.profilePictureUrl || '/default-avatar.png'"
        [alt]="user.userName"
      />
      <span matListItemTitle>{{ user.firstName }} {{ user.lastName }}</span>
    </mat-list-item>
  }
</mat-list>
