<mat-list>
  @for (user of users$ | async; track user.id) {
    <mat-list-item class="user-item" [routerLink]="['/home/users', user.id]">
      <img
        matListItemAvatar
        class="user-avatar"
        [src]="user.profilePictureUrl || 'assets/default-avatar.png'"
        [alt]="user.username"
      />
      <span matListItemTitle>{{ user.firstName }} {{ user.lastName }}</span>
    </mat-list-item>
  }
</mat-list>
