<mat-list>
  @for (user of users$ | async; track user.id) {
  <mat-list-item class="user-item" [routerLink]="['/profile', user.userName]">
    <img matListItemAvatar class="user-avatar" [src]="user.profilePictureUrl || '/default-avatar.png'"
      [alt]="user.userName" />
    <span matListItemTitle>{{ user.firstName }} {{ user.lastName }}</span>
  </mat-list-item>
  }
</mat-list>
