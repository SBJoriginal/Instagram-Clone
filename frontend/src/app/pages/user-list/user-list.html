<h1>Users</h1>

<div class="user-list">
  @for (user of users; track user.id) {
    <a class="user-card" [routerLink]="['/home/users', user.id]">
      <img [src]="user.profilePictureUrl" [alt]="user.username" />
      <div>
        <strong>@{{ user.username }}</strong>
        <p>{{ user.firstName }} {{ user.lastName }}</p>
      </div>
    </a>
  }
</div>
