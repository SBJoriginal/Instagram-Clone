<div class="image-detail-container">
  <button class="close-btn" (click)="goBack()" aria-label="Close detail view">
    <mat-icon>close</mat-icon>
  </button>

  @if (image) {
    <div class="image-detail-card">
      <div class="section user-header">
        <mat-icon>account_circle</mat-icon>
        <button
          type="button"
          class="username"
          (click)="navigateToProfile(image.username)"
          (keydown.enter)="navigateToProfile(image.username)"
          (keydown.space)="navigateToProfile(image.username)"
          style="
            cursor: pointer;
            text-decoration: underline;
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            color: inherit;
            display: inline-flex;
            align-items: center;
            margin-left: 8px;
          "
        >
          {{ image.username || 'User Not Found' }}
        </button>
      </div>

      <div class="section image-display">
        <img [src]="'http://localhost:8081' + image.filePath" [alt]="image.description" />
      </div>

      <div class="section info-block">
        <p class="description">
          <span class="highlight">{{ image.description || 'No description' }}</span>
        </p>
      </div>

      @if (image.hashtags) {
        <div class="section info-block">
          <span class="highlight">{{ image.hashtags }}</span>
        </div>
      }

      @if (image.mentions) {
        <div class="section info-block">
          <span class="highlight">{{ image.mentions }}</span>
        </div>
      }

      <div class="section date-footer">
        {{ image.createdAt | date: 'longDate' }}
      </div>
    </div>
  } @else if (!loading) {
    <div class="error-container">
      <p>Image not found.</p>
      <button mat-button color="primary" (click)="goBack()">Return</button>
    </div>
  }
</div>
