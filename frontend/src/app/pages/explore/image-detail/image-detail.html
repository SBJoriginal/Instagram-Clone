<h2 mat-dialog-title>Détails de l'image</h2>
<mat-dialog-content class="mat-typography">
    <div class="modal-body">
        <div class="image-container">
            <img [src]="'http://localhost:5266' + image.filePath" [alt]="image.description">
        </div>
        <div class="info-sidebar">
            <h3>Description</h3>
            <p>{{ image.description || 'Aucune description' }}</p>

            <div class="tags-section">
                <strong>Hashtags:</strong>
                <p class="blue-text">{{ image.hashtags || '#aucun' }}</p>
            </div>

            <div class="mentions-section">
                <strong>Mentions:</strong>
                <p class="blue-text">{{ image.mentions || '@aucune' }}</p>
            </div>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button (click)="dialogRef.close()">Fermer</button>
</mat-dialog-actions>
