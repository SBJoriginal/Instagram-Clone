<app-explore-header
  (searchTypeChange)="onSearchTypeChange($event)"
  (imageFilterChange)="onImageFilterChange($event)"
>
</app-explore-header>

<div class="explore-content">
  @if (currentSearchType() === 'images') {
    @if (images().length === 0 && !isLoading()) {
      <div class="no-results">
        <mat-icon>photo_library</mat-icon>
        <p>No images found</p>
      </div>
    } @else {
      <div class="image-grid">
        @for (image of images(); track image.id) {
          <button type="button" class="grid-item-button" (click)="openImage(image)">
            <div class="grid-item">
              <img [src]="image.filePath" [alt]="image.description" loading="lazy" />
              <div class="overlay"><mat-icon>visibility</mat-icon></div>
            </div>
          </button>
        }
      </div>
      <div #sentinel class="loading-trigger">
        @if (isLoading()) {
          <mat-spinner diameter="40"></mat-spinner>
        }
      </div>
    }
  } @else {
    <div class="user-results-container">
      <app-user-list></app-user-list>
    </div>
  }
</div>
