<app-profile-header [username]="username()"></app-profile-header>

<div class="profile-container">
  <div class="image-grid">
    @for (image of images | async; track image.id) {
      <mat-card class="image-card">
        <div class="image-header">
          @if (isOwnProfile()) {
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Image actions">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="openEditDialog(image)">
                <mat-icon>edit</mat-icon>
                <span>Edit</span>
              </button>
              <button mat-menu-item (click)="deleteImage(image)">
                <mat-icon>delete</mat-icon>
                <span>Delete</span>
              </button>
            </mat-menu>
          }
        </div>

        <button
          type="button"
          class="image-trigger-button"
          (click)="openImageDetail(image)"
          [aria-label]="'View details for ' + image.description"
        >
          <img
            mat-card-image
            [src]="image.filePath"
            [alt]="image.description"
            loading="lazy"
            class="clickable-image"
          />
        </button>

        <mat-card-content>
          <div class="card-actions">
            <button
              mat-icon-button
              class="reaction-button"
              [class.reacted]="image.hasReacted"
              (click)="onToggleReaction($event, image)"
              [aria-label]="image.hasReacted ? 'Remove like' : 'Like'"
            >
              <mat-icon>{{ image.hasReacted ? 'favorite' : 'favorite_border' }}</mat-icon>
            </button>
            @if (image.reactionCount > 0) {
              <span class="reaction-count">
                {{ image.reactionCount }}
              </span>
            }
            <div
              class="comment-summary-inline"
              (click)="openImageDetail(image)"
              (keyup.enter)="openImageDetail(image)"
              role="button"
              tabindex="0"
            >
              <mat-icon>chat_bubble_outline</mat-icon>
              @if (image.commentCount > 0) {
                <span class="comment-count-text">{{ image.commentCount }}</span>
              }
            </div>
          </div>
          <p class="description">{{ image.description }}</p>
        </mat-card-content>
      </mat-card>
    } @empty {
      <p>No images uploaded yet.</p>
    }
  </div>
</div>
