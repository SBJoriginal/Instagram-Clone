<mat-sidenav-container class="shell-container" autosize>
  <mat-sidenav #sidenav [mode]="isMobile() ? 'over' : 'side'" [opened]="!isMobile()">
    <app-navigation />
  </mat-sidenav>
  <mat-sidenav-content>
    @if (isMobile()) {
      <button mat-icon-button (click)="sidenav.toggle()" class="burger-btn">
        <mat-icon>menu</mat-icon>
      </button>
    }
    <main class="main-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
