<aside class="sidebar">
  <div class="sidebar-header">
    <app-logo />
  </div>

  <nav class="sidebar-nav">
    <button
      mat-button
      class="nav-item"
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>home</mat-icon>
      <span>Home</span>
    </button>
    <button mat-button class="nav-item">
      <mat-icon>search</mat-icon>
      <span>Search</span>
    </button>
    <button mat-button class="nav-item">
      <mat-icon>explore</mat-icon>
      <span>Explore</span>
    </button>
    <button mat-button class="nav-item" (click)="openCreateDialog()">
      <mat-icon>add_box</mat-icon>
      <span>Create</span>
    </button>
    <button mat-button class="nav-item">
      <mat-icon>group</mat-icon>
      <span>Users</span>
    </button>
    <button mat-button class="nav-item" routerLink="/home/profile" routerLinkActive="active">
      <mat-icon>account_circle</mat-icon>
      <span>Profile</span>
    </button>
    <button mat-button class="nav-item" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Log out</span>
    </button>
  </nav>
</aside>
