<aside class="sidebar">
  <div class="sidebar-header">
    <app-logo />
  </div>

  <nav class="sidebar-nav">
    <button
      mat-button
      class="nav-item"
      routerLink="/explore"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>explore</mat-icon>
      <span>Explore</span>
    </button>
    <button mat-button class="nav-item" (click)="openCreateDialog()">
      <mat-icon>add_box</mat-icon>
      <span>Create</span>
    </button>
    <button mat-button class="nav-item" (click)="togglePanel()">
      <div class="bell-wrapper">
        <mat-icon>notifications</mat-icon>
        @if (notificationService.unreadCount() > 0) {
          <span class="badge">{{ notificationService.unreadCount() }}</span>
        }
      </div>
      <span>Notifications</span>
    </button>
    <button mat-button class="nav-item" routerLink="/profile" routerLinkActive="active">
      <mat-icon>account_circle</mat-icon>
      <span>Profile</span>
    </button>
    <button mat-button class="nav-item" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Log out</span>
    </button>
  </nav>
</aside>
@if (isPanelOpen()) {
  <app-notification-panel (close)="isPanelOpen.set(false)" />
}
