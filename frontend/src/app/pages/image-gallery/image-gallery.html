@if (images.length > 0) {
  <div class="image-grid">
    @for (image of images; track image.id) {
      <mat-card class="image-card">
        <img mat-card-image [src]="image.imageUrl" [alt]="image.description" loading="lazy" />
        <mat-card-content>
          <p>{{ image.description }}</p>
          <p class="hashtags">{{ image.hashtags.join(' ') }}</p>
          @if (image.mentionedUser) {
            <p class="mention">@{{ image.mentionedUser }}</p>
          }
          <p class="date">{{ image.createdAt }}</p>
        </mat-card-content>
      </mat-card>
    }
  </div>
} @else {
  <p class="no-images">No images yet.</p>
}
