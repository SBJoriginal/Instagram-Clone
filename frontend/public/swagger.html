<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>API Documentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js" crossorigin></script>
  <script>
    window.onload = () => {
      // The deployment script replaces "http://localhost:8081/api" with the actual API URL.
      const apiUrl = 'http://localhost:8081/api';
      // Swagger JSON is typically at {backend_root}/swagger/v1/swagger.json
      const swaggerJsonUrl = apiUrl.replace(/\/api\/?$/, '/swagger/v1/swagger.json');
      
      window.ui = SwaggerUIBundle({
        url: swaggerJsonUrl,
        dom_id: '#swagger-ui',
      });
    };
  </script>
</body>
</html>
