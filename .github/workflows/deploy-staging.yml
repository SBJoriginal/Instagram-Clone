name: Deploy to Staging

# Triggered on every push to develop (i.e. when a PR is merged)
on:
  push:
    branches: [develop]

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Gate: CI must be green before we touch the staging environment
  # ──────────────────────────────────────────────────────────────────────────────
  ci-backend:
    name: CI — Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

  ci-frontend:
    name: CI — Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────────────
  # Migrations — runs AFTER CI, BEFORE deploy.
  # If this step fails, neither backend nor frontend will be deployed.
  # ──────────────────────────────────────────────────────────────────────────────
  migrate:
    name: Run DB Migrations → Staging RDS
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: ./backend/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (required for EF tooling)
        run: dotnet build --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Run migrations against Staging RDS
        env:
          ASPNETCORE_ENVIRONMENT: Staging
          ConnectionStrings__DefaultConnection: ${{ secrets.STAGING_DB_CONNECTION }}
        run: |
          dotnet ef database update \
            --project UGram.csproj \
            --no-build

  # ──────────────────────────────────────────────────────────────────────────────
  # Deploy Backend → AWS Elastic Beanstalk
  #
  # Pre-requisites:
  #   - An EB application named "ugram-backend" must exist in us-east-2
  #   - An EB environment named "ugram-backend-dev" pointing to that application
  #   - The EB environment must have these env vars configured (via EB console or CLI):
  #       ASPNETCORE_ENVIRONMENT=Staging
  #       ConnectionStrings__DefaultConnection=<rds-connection-string>
  #       JwtSettings__Secret=<jwt-secret>
  #       AWS_REGION=us-east-2
  #       S3__BucketName=<s3-bucket-for-images>
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Elastic Beanstalk
    needs: [migrate]
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: ./backend/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish
        run: dotnet publish UGram.csproj -c Release -o ./publish

      - name: Create runtime Dockerfile
        run: |
          cat > ./publish/Dockerfile <<EOF
          FROM mcr.microsoft.com/dotnet/aspnet:8.0
          WORKDIR /app
          COPY . .
          RUN mkdir -p /app/uploads
          ENV ASPNETCORE_URLS=http://+:8080
          ENV ASPNETCORE_ENVIRONMENT=Staging
          EXPOSE 8080
          ENTRYPOINT ["dotnet", "UGram.dll"]
          EOF
          cp -r .platform ./publish/ || true


      - name: Create deployment zip
        run: |
          cd ./publish
          zip -r ../../../deploy-backend.zip .

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ugram-backend
          environment_name: ugram-backend-dev
          region: us-east-2
          version_label: staging-${{ github.sha }}
          deployment_package: deploy-backend.zip
          use_existing_version_if_available: true
          # Wait up to 10 min for EB to finish rolling out
          wait_for_environment_recovery: 600

  # ──────────────────────────────────────────────────────────────────────────────
  # Deploy Frontend → S3 static hosting
  #
  # Pre-requisites:
  #   - An S3 bucket named ${{ secrets.STAGING_FRONTEND_BUCKET }} with static
  #     website hosting enabled (or served through CloudFront)
  #   - If using CloudFront, set STAGING_CF_DISTRIBUTION_ID and uncomment the
  #     invalidation step below
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → S3
    needs: [migrate]
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Inject Environment Variables
        run: |
          sed -i "s|http://localhost:8081/api|${{ secrets.STAGING_API_URL }}|g" src/environments/*.ts
          sed -i "s|GOOGLE_CLIENT_ID_PLACEHOLDER|${{ secrets.STAGING_GOOGLE_CLIENT_ID }}|g" src/environments/*.ts
          sed -i "s|http://localhost:8081|$(echo "${{ secrets.STAGING_API_URL }}" | sed 's|/api$||')|g" src/index.html
          sed -i "s|ws://localhost:8081|$(echo "${{ secrets.STAGING_API_URL }}" | sed 's|/api$||' | sed 's|http|ws|')|g" src/index.html

      - name: Build
        run: npm run build

      - name: List build artifacts (Debug)
        run: |
          ls -R dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Sync static assets to S3 (long-lived cache)
        run: |
          BUCKET=$(echo "${{ secrets.STAGING_FRONTEND_BUCKET }}" | xargs)
          aws s3 sync dist/frontend/browser/ "s3://${BUCKET}" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload index.html (no-cache — always fetch fresh)
        run: |
          BUCKET=$(echo "${{ secrets.STAGING_FRONTEND_BUCKET }}" | xargs)
          aws s3 cp dist/frontend/browser/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      # Uncomment once CloudFront is set up:
      # - name: Invalidate CloudFront cache
      #   run: |
      #     aws cloudfront create-invalidation \
      #       --distribution-id ${{ secrets.STAGING_CF_DISTRIBUTION_ID }} \
      #       --paths "/*"
