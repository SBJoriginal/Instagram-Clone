services:
  db:
    image: postgres:15-alpine
    container_name: ugram_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ugram_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ugram-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: ugram_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Database=ugram_dev;Username=postgres;Password=${DB_PASSWORD}
      - JwtSettings__Secret=${JWT_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-2}
      - S3__BucketName=${S3_BUCKET_NAME}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - SENTRY_DSN=${SENTRY_DSN}
      - GoogleAnalytics__ApiSecret=${GA_API_SECRET}
    ports:
      - "8081:8080"
    volumes:
      - ./backend/backend/uploads:/app/uploads
      - ./backend/backend/wwwroot/images:/app/wwwroot/images
    networks:
      - ugram-network
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "========================================"
        echo "Backend API available at:"
        echo "  - http://localhost:8080"
        echo "  - Swagger UI: http://localhost:8080/swagger"
        echo "========================================"
        exec dotnet UGram.dll

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - SENTRY_DSN=${SENTRY_DSN}
    container_name: ugram_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - ugram-network
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "========================================"
        echo "Frontend available at:"
        echo "  - http://localhost:4200"
        echo "========================================"
        exec nginx -g 'daemon off;'

volumes:
  postgres_data:


networks:
  ugram-network:
    driver: bridge
